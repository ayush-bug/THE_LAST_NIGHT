<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon"
        href="https://raw.githubusercontent.com/ayush-bug/THE_LAST_NIGHT/refs/heads/main/assets/skull-red-icon.png"
        type="image/x-icon">
    <title>MIssion 9 : Destroy </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: rgb(25, 3, 14);
            background: url(assets/mission8bg.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

        }

        @font-face {
            font-family: creepy;
            src: url("../assets/fonts/THECREEPYHUNTER.ttf");
        }

        .story {
            display: none;
            position: fixed;

            bottom: 30%;
            left: 30%;
            transform: translate(-50px);
            width: 50%;
            height: auto;
            text-align: center;
            color: white;
            font-size: larger;
            z-index: 9999;
            border: 3px solid rgb(224, 5, 5);
            background-color: rgba(97, 32, 0, 0.73);
            border-radius: 10px;
            box-shadow: 3px 3px 4px black;
            animation: fadein 2s ease forwards;
        }

        @keyframes fadein {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .story h2 {
            padding: 20px;
            font-family: creepy;
            font-size: xx-large;
            text-shadow: 2px 3px 2px black;
            letter-spacing: 7px;
        }

        #next,
        #ok,
        #after,
        #done {
            width: 100px;
            height: 30px;
            border: none;
            background-color: rgb(91, 5, 134);
            margin-bottom: 10px;
            border: 2px solid rgb(215, 0, 248);
            border-radius: 10px;
            font-weight: bolder;
            cursor: pointer;
            color: white;
        }
          .code-overlay {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .code-box {
            width: 320px;
            padding: 30px;
            background-color: #100909;
            border: 1px solid #8b0000;
            box-shadow: 0 0 25px rgba(180, 0, 0, 0.3);
            text-align: center;
            color: white;
            font-family: monospace;
        }

        .code-box h2 {
            color: #c00000;
            margin-bottom: 15px;
        }

        #unlock {
            padding: 12px 22px;
            background: #850000;
            color: white;
            border: none;
            cursor: pointer;

        }
    </style>
</head>

<body>

    <div class="code-overlay" id="overlay">
        <div class="code-box">
            <h2>Mission locked</h2>
            <p>Complete mission 7 to unlock this mission .</p>
            <br>
            <a href="mission7.html" target="_blank"><button id="unlock">Unlock</button>
            </a>
        </div>

    </div>


    <div class="story">
        <h2 id="text1"></h2>
        <h2 id="timeError"></h2>
        <h2 id="text2"></h2>
        <h2 id="text3"></h2>
        <h2 id="text4" style="display: none;"></h2>
        <h2 id="text5" style="display: none;"></h2>
        <button id="next">OK , Next</button>
        <button id="ok" style="display: none;">oke then</button>
        <button id="after" style="display: none;">OK next?</button>
        <button id="done" style="display: none;">Done</button>
    </div>

    <script>
        const bgm = new Audio('../assets/audio/mission8bgm.mp3');

        document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
                bgm.pause();
            } else {
                bgm.play();
            }
        });



        const text1 = "MISSION 8 *: Finally the last and final mission , you really did a great job , completed all the previous missions .";
        let i = 0;
        function Type(text, ele) {
            let i = 0;
            function write() {
                if (i < text.length) {
                    ele.textContent += text.charAt(i);
                    i++;
                    setTimeout(write, 70);
                }
            }
            write();
        }
        if (localStorage.getItem("mission8Unlocked") === "true") {
            Type(text1, document.getElementById("text1"));
            bgm.play();
            document.querySelector(".story").style.display = "block";
            document.getElementById("overlay").style.display = "none";
        }

        document.getElementById("next").addEventListener('click', function () {
            document.getElementById("text1").style.display = "none";
            document.getElementById("next").style.display = "none";
            const now = new Date();

            const hours = now.getHours();
            const minutes = now.getMinutes();

            const time = `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;



            const missionTime = (hours >= 23) || (hours < 1) || (hours === 1 && minutes === 0);
            if (missionTime) {
                const text2 = "before we proceed, please read this , you need 4 candles and the drawing you made in mission 6, now this is the time you need to destroy that evil . ";
                Type(text2, document.getElementById("text2"));
                document.getElementById("ok").style.display = "block";
                document.getElementById("ok").addEventListener('click', function () {
                    document.getElementById("ok").style.display = "none";
                    document.getElementById("text2").style.display = "none";
                    const text3 = "Read this carefully , Now you need to perform this in your bedroom , burn the candles and place it on each corners of your drawing and pray to your god to destroy them . ;"
                    Type(text3, document.getElementById("text3"));
                    document.getElementById("after").style.display = "block";
                });
                document.getElementById("after").addEventListener('click', function () {
                    document.getElementById("after").style.display = "none";
                    document.getElementById("text3").style.display = "none";
                    const text4 = "After praying , burn that paper completely with those candles , put the ashes in a box and throw it outside or place it in the ground";
                    document.getElementById("text4").style.display = "block";
                    Type(text4, document.getElementById("text4"));
                    document.getElementById("done").style.display = "block";
                });
                document.getElementById("done").addEventListener('click', function () {
                    document.getElementById("text5").style.display = "block";
                    document.getElementById("text4").style.display = "none";
                    document.getElementById("after").style.display = "none";
                    const text5 = "You are really so brave , you did a great job , now no one can scare you because god is with you . The escape door is open now please escape as soon as possible . go back and escape";
                    Type(text5, document.getElementById("text5"));
                    document.getElementById("done").style.display = "none";

                    setInterval(() => {
                        document.location.href = "../index.html";
                    }, 20000);
                });
            }
            else {
                const timeerror = ` you can only complete this mission between 11:00 pm to 1:00 AM , so make sure your time should match , currenly its ${time}`;
                Type(timeerror, document.getElementById('timeError'));
            }
        });
    </script>
</body>

</html>
