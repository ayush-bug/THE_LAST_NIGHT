<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="https://raw.githubusercontent.com/ayush-bug/THE_LAST_NIGHT/refs/heads/main/assets/skull-red-icon.png" type="image/x-icon">
    <title>Mission 2 : Spot The Diffrence to get code .
    </title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background: rgb(25, 3, 14);
        }
        .rules-container{
            width: 100%;
            height: 97vh;
            display: none;
            flex-direction: column;
            gap: -10px;
            align-items: center;
            justify-content: center;
        }
        .rules{
    width: 300px;
   height: 100%;
    background-image: url("./assets/rules-bg.jpg");
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
   filter: drop-shadow(0 10px 25px rgba(218, 15, 15, 0.8));
   animation: load 2s ease forwards;
        }
    
@keyframes load {
    from {
        opacity: 0;
        clip-path: inset(0 0 100% 0);
    }

    to {
        opacity: 1;
        clip-path: inset(0 0 0 0);
    }
}
@font-face {
    font-family: breathHouse;
    src: url(../assets/fonts/breath-house.ttf);
}
.rules h1{
    position: absolute;
    top: 30%;
    left: 0;
    text-align: center;
    font-family: breathHouse;
    color: rgb(7, 39, 2);
    text-shadow: 0 0 10px rgba(218, 15, 15, 0.8);
}
.okey{
    border: 3px solid white;
    background: transparent;
    padding: 20px;
    width: 10%;
    color: wheat;
    border-radius: 10px;
    font-size: large;
    opacity: 0;
    animation: buttonshow 1s ease 2s forwards;
    cursor: pointer;
}
.okey:hover{
    transform: scale(1.08);
}
@keyframes buttonshow {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.code-image{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    z-index: 99;
    overflow: hidden;
    display: none;
}
.code-image img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.story{
    display: none;
    position: fixed;
    bottom: 40px;
    left: 30%;
    transform: translate(-50px);
    width: 50%;
    height: auto;
    text-align: center;
    color: white;
    font-size: larger;
    z-index: 9999;
    border: 3px solid crimson;
    background-color: rgb(44, 1, 1);
    border-radius: 10px;
    box-shadow: 3px 3px 4px black;
       animation: fadein 2s ease forwards;
}

 @keyframes fadein{
    from{
        opacity: 0;
    }
    to{
        opacity: 1;
    }
 }
.story h2{
    padding: 20px;
    font-family: breathHouse;
    font-size: x-large;
    text-shadow: 2px 3px 2px black;
    letter-spacing: 2px;
}
#next, #ok{
    width: 100px;
    height: 30px;
    border: none;
    background-color: rgb(235, 33, 50);
    margin-bottom: 10px;
    border:2px solid  black;
    border-radius: 10px;
    font-weight: bolder;
    cursor: pointer;
}
.code-overlay{
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(0, 0, 0, 0.92);
    display: flex;
    justify-content: center;
    align-items: center;
}
.code-box{
    width: 320px;
    padding: 30px;
    background-color: #100909;
    border: 1px solid #8b0000;
    box-shadow: 0 0 25px rgba(180, 0, 0, 0.3) ;
    text-align: center;
    color: white;
    font-family: monospace;
}
.code-box h2{
    color: #c00000;
    margin-bottom: 15px;
}
#missionCode{
    width: 30%;
    padding: 12px;
    margin: 20px 0 12px;
    box-sizing: border-box;
    background-color: #080808;
    color: white;
    border: 1px solid #555;
    outline: none;

}
#unlock{
    padding: 12px 22px;
    background: #850000;
    color: white;
    border: none;
    cursor: pointer;
   
}
.show-spot{
    width: 100%;
    
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    justify-content: center;
    align-items: center;
    background-color:  rgba(80, 80, 80, 0.75);
}
 .show-spot img{
    max-width: 90vw;
    max-height: 85vw;
    object-fit: contain;
    border: 1px solid #555555;
    box-shadow:  0 0 25px rgba(0, 0, 0, 0.6);
} 
    </style>
</head>
<body>
    <div class="code-overlay" id="overlay">
        <div class="code-box">
            <h2>Mission locked</h2>
            <p>Enter the hidden code you got in mission 1</p>
        </div>
        <input type="text" required id="missionCode" placeholder="Enter code">
         <button id="unlock" >Unlock</button>
         <p id="message"></p>
    </div>
   
    <div class="story">
        <h2 id="text1"></h2>
        <h2 id="text2"></h2>
        <button id="next">OK </button>
        <button id="ok" style="display: none;">OK</button>
        </div>
         <div class="show-spot">
        
            <img src="assets/spot.png" alt="spot the diffrence">
        
    </div>
    <div class="rules-container">
        <div class="rules">
           <h1></h1>
        </div>
        <button class="okey">OKEY</button>
    </div>
     <div class="code-image">
        <img src="assets/mission2bg.jpg" alt="find code">
     </div>
    <script>
const rule1 = "MISSION 2 :  In this mission you have to spot the diffrence between two images .";
let i = 0;
function Type(text,ele) {
    let i = 0;
    function write() {
        if (i < text.length) {
           ele.textContent += text.charAt(i);
            i++;
            setTimeout(write, 70);
        }
    }
    write();
}
 Type(rule1,document.querySelector('.rules h1'));
const click = new Audio('../assets/audio/clickSound.mp3')
document.querySelector('body').addEventListener('click' , function(){
    click.play();
});
const bgm = new Audio('../assets/audio/mission2bgm.mp3');

document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
        bgm.pause();
    } else {
        bgm.play();
    }
});

const instruction = "so you need to find the total number of diffrence in the images .";
const instruction2 = "after that conver that number into binary and that will be your code for next mission ."; 
document.querySelector('.okey').addEventListener('click' , function(){
    document.querySelector('.rules-container').style.display= "none";
    document.querySelector('.code-image').style.display = "block";
    bgm.play();
  Type(instruction,document.querySelector('#text1'));
     document.querySelector('.show-spot').style.display = "flex";
    document.querySelector('.story').style.display = "block";
});
document.getElementById("next").addEventListener('click', function(){
  document.querySelector('#text1').style.display = "none";
  document.querySelector('#ok').style.display = "block";
  Type(instruction2,document.querySelector('#text2'));
  document.querySelector('#text2').style.display = "block";
  document.querySelector('#next').style.display = "none";
});
document.getElementById("ok").addEventListener('click', function(){
    document.querySelector('.story').style.display = "none";
});


// check for mission unlocked
if (localStorage.getItem("mission2Unlocked") === "true") {
    document.querySelector(".code-overlay").style.display = "none";
     document.querySelector(".rules-container").style.display = "flex";
}
// unlock mission code
document.getElementById('unlock').addEventListener('click',function(){
    const code = document.getElementById('missionCode').value.trim();
    const message = document.getElementById('message');
    if(code.toLowerCase() == "3am" || code.toLowerCase() == "3 am"){
        localStorage.setItem("mission2Unlocked", "true");
        message.textContent = "Mission unlocked";
        message.style.color = "#00ff66";
        setInterval(() =>{
         document.querySelector("#overlay").style.display = "none";
         document.querySelector(".rules-container").style.display = "flex";
        },800);
    }else {
        message.textContent = "Access denied , try again ";
        message.style.color = "#ff3333";
    }
})

    </script>
</body>
</html>
